name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # The canonical gate: format, vet, golangci-lint with go-quality's config
  # (errorlint, funlen 60, revive, forbidigo, gosec), govulncheck, race tests.
  # Run from a clone outside the workspace, not via the reusable workflow: that one
  # checks go-quality out inside the module, and the format step then walks into
  # go-quality's own deliberately dirty fixture (go-quality kanban, gate-walks-own-fixture).
  # Tool versions match go-check.yml@v1. Return to the reusable workflow once fixed.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # standard library only: no go.sum to key a cache on
      - name: install gate tools (pinned as go-check.yml@v1)
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.44.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.4/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.11.4
      - name: go-quality gate (pinned commit)
        run: |
          # Pinned to the commit the moving tag v1 pointed at on 2026-10-26 (go-quality has no
          # other tags). Bump it deliberately, not by following the tag.
          git clone --quiet https://github.com/mattjoyce/go-quality "$RUNNER_TEMP/go-quality"
          git -C "$RUNNER_TEMP/go-quality" checkout --quiet d507d3623243520b46ecbf3098ec775f7a3e0187
          bash "$RUNNER_TEMP/go-quality/check.sh" .

  # Coverage floor and a bounded fuzz run: the engine promises never to panic on
  # consumer input, and the fuzz suites are what hold it.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # standard library only: no go.sum to key a cache on
      - name: coverage floor (80%)
        run: |
          go test -count=1 -coverprofile=cover.out ./...
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p >= 80) ? 0 : 1 }'
      - name: fuzz (30s per target)
        run: |
          for t in FuzzParseCompileEvaluate FuzzTransitiveClosure FuzzNegationAndRepeatedVariables FuzzNumberRoundTrip FuzzNumberAdd FuzzDemandMatchesFull; do
            go test -run '^$' -fuzz "^${t}\$" -fuzztime 30s .
          done
